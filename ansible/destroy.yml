---
- name: Remove only managed rootless Podman agent containers
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validate the resolved runtime names
      ansible.builtin.assert:
        that:
          - ads_runtime_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - ads_builder_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
        fail_msg: Refusing to destroy an invalid Podman target.

    - name: Display the concrete removal target
      ansible.builtin.debug:
        msg: "Removing Podman runtime '{{ ads_runtime_name }}' and builder '{{ ads_builder_name }}'; runtime state and workspace mounts are preserved."

    - name: Remove the managed runtime
      ansible.builtin.command:
        argv: ["{{ ads_container_manager }}", rm, --force, "{{ ads_runtime_name }}"]
      register: ads_destroy_runtime
      changed_when: false
      failed_when: false

    - name: Remove the managed provisioning container
      ansible.builtin.command:
        argv: ["{{ ads_container_manager }}", rm, --force, "{{ ads_builder_name }}"]
      changed_when: false
      failed_when: false
