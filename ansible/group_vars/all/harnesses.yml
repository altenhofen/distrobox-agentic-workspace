---
# Install sources are deliberately centralized. Override a package/version in host_vars
# if an upstream release changes before this catalog is updated.
ads_harness_catalog:
  opencode:
    name: OpenCode
    source: npm
    package: opencode-ai
    version: latest
    install_method: npm_global
    dependencies: [nodejs, npm]
    command: opencode
    verify_command: opencode --version
    optional: false
  codex:
    name: Codex
    source: npm
    package: "@openai/codex"
    version: latest
    install_method: npm_global
    dependencies: [nodejs, npm]
    command: codex
    verify_command: codex --version
    optional: false
  claudecode:
    name: Claude Code
    source: npm
    package: "@anthropic-ai/claude-code"
    version: latest
    install_method: npm_global
    dependencies: [nodejs, npm]
    command: claude
    verify_command: claude --version
    optional: false
  pi:
    name: Pi
    source: npm
    package: "@mariozechner/pi-coding-agent"
    version: latest
    install_method: npm_global
    dependencies: [nodejs, npm]
    command: pi
    verify_command: pi --version
    optional: false
  omp:
    name: OMP
    source: npm
    package: oh-my-pi
    version: latest
    install_method: npm_global
    dependencies: [nodejs, npm]
    command: omp
    verify_command: omp --version
    optional: false
  jcode:
    name: JCode
    source: npm
    package: jcode
    version: latest
    install_method: npm_global
    dependencies: [nodejs, npm]
    command: jcode
    verify_command: jcode --version
    optional: false

