---
ads_box_name: agentic
ads_image: quay.io/toolbx/arch-toolbox:latest
ads_box_home: "{{ lookup('env', 'HOME') }}/distrobox-agent"
ads_container_manager: podman
ads_unshare_all: true
ads_container_pids_limit: 512
ads_container_memory: 8g
ads_container_cpus: 4
ads_container_allow_host_loopback: false
ads_container_network_backend: pasta
ads_hardening_profile: buzz-v2
ads_repositories_mount_enabled: false
ads_repositories_host_path: ""
ads_repositories_box_path: /workspace
ads_repositories_mount_read_only: true
ads_buzz_connectivity_check: false
ads_buzz_repository: block/buzz
ads_buzz_appimage_aur_package: buzz-appimage
ads_buzz_sprig_release_tag: sprig-latest
ads_buzz_sprig_assets:
  x86_64: {name: sprig-x86_64-unknown-linux-musl.tar.gz, sha256: f145dfed781ef4cfd3876d8396198c9abde55a163e79b1f9dfeab2e515fae583}
  aarch64: {name: sprig-aarch64-unknown-linux-musl.tar.gz, sha256: 17d939791d81b0a88d3ed2a8527aa2e866d66c0aa8cecab57bff8a0d7a371799}
# buzz-agent-create accepts only these names and fixed argument lists. Commands
# outside this mapping cannot be selected by callers.
ads_buzz_agent_allowlist:
  opencode: {command: opencode, args: []}
  codex: {command: codex, args: []}
  claudecode: {command: claude, args: []}
  pi: {command: pi, args: []}
  omp: {command: omp, args: []}
  jcode: {command: jcode, args: []}
ads_ai_jail_enabled: true
ads_ai_jail_aur_package: ai-jail-bin
ads_ai_jail_network: true
ads_ai_jail_agent_state: true
ads_ai_jail_deny_host_home: true
ads_ai_jail_deny_paths:
  - /run/host
  - /usr/bin/distrobox-host-exec
  - /run/podman
  - /var/run/docker.sock
  - /run/docker.sock
ads_enabled_harnesses:
  - opencode
  - codex
  - claudecode
  - pi
  - omp
  - jcode
