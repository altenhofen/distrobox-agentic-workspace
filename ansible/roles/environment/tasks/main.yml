---
- name: Validate paired Buzz and Git settings
  ansible.builtin.assert:
    that:
      - (ads_buzz_relay_url | default('') | length > 0) == (ads_buzz_private_key | default('') | length > 0)
      - (ads_git_user_name | default('') | length > 0) == (ads_git_user_email | default('') | length > 0)
    fail_msg: Buzz URL/key and Git name/email must each be configured as complete pairs.
  no_log: true

- name: Write the private Buzz shell fragment
  ansible.builtin.copy:
    dest: "{{ ads_runtime_state_path }}/.ads-buzz-env"
    mode: "0600"
    content: |
      export BUZZ_RELAY_URL={{ ads_buzz_relay_url | quote }}
      export BUZZ_PRIVATE_KEY={{ ads_buzz_private_key | quote }}
      export BUZZ_ACP_RESPOND_TO={{ ads_buzz_acp_respond_to | quote }}
      {% if ads_buzz_acp_agent_owner | default('') | length > 0 %}
      export BUZZ_ACP_AGENT_OWNER={{ ads_buzz_acp_agent_owner | quote }}
      {% endif %}
      {% if ads_buzz_auth_tag | default('') | length > 0 %}
      export BUZZ_AUTH_TAG={{ ads_buzz_auth_tag | quote }}
      {% endif %}
  when: ads_buzz_relay_url | default('') | length > 0
  no_log: true

- name: Remove stale Buzz environment when credentials are absent
  ansible.builtin.file:
    path: "{{ ads_runtime_state_path }}/.ads-buzz-env"
    state: absent
  when: ads_buzz_relay_url | default('') | length == 0
  no_log: true

- name: Ensure interactive shells load the Buzz fragment
  ansible.builtin.blockinfile:
    path: "{{ ads_runtime_state_path }}/.bashrc"
    create: true
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED AGENTIC SANDBOX"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
      [ ! -r "$HOME/.ads-buzz-env" ] || . "$HOME/.ads-buzz-env"

- name: Ensure login shells load the managed interactive environment
  ansible.builtin.blockinfile:
    path: "{{ ads_runtime_state_path }}/.bash_profile"
    create: true
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED AGENTIC SANDBOX LOGIN"
    block: |
      [ ! -r "$HOME/.bashrc" ] || . "$HOME/.bashrc"

- name: Configure Git identity only inside the persistent box home
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_builder_name }}", git, config, --global, "{{ item.key }}", "{{ item.value }}"]
  loop:
    - { key: user.name, value: "{{ ads_git_user_name | default('') }}" }
    - { key: user.email, value: "{{ ads_git_user_email | default('') }}" }
  when: ads_git_user_name | default('') | length > 0
  no_log: true
  changed_when: true
