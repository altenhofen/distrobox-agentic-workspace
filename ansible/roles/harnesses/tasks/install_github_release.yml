---
- name: "Validate GitHub release contract for {{ ads_harness_id }}"
  ansible.builtin.assert:
    that:
      - ads_harness_catalog[ads_harness_id].repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      - ads_harness_catalog[ads_harness_id].version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
      - ansible_architecture in ads_harness_catalog[ads_harness_id].release_assets
    fail_msg: "No trusted release asset is configured for {{ ads_harness_id }} on {{ ansible_architecture }}."

- name: "Check installed {{ ads_harness_id }} version"
  ansible.builtin.command:
    argv: [distrobox, enter, "{{ ads_box_name }}", --, "/usr/local/bin/{{ ads_harness_catalog[ads_harness_id].command }}", --version]
  register: ads_github_harness_current
  changed_when: false
  failed_when: false

- name: "Download and install verified {{ ads_harness_id }} release"
  ansible.builtin.command:
    argv:
      - distrobox
      - enter
      - "{{ ads_box_name }}"
      - --
      - bash
      - -lc
      - >-
        set -euo pipefail;
        release_base={{ ('https://github.com/' + ads_harness_catalog[ads_harness_id].repository + '/releases/download/' + ads_harness_catalog[ads_harness_id].version) | quote }};
        asset={{ ads_harness_catalog[ads_harness_id].release_assets[ansible_architecture] | quote }};
        archive_binary=${asset%.tar.gz};
        workdir=$(mktemp -d);
        trap 'rm -rf "$workdir"' EXIT;
        curl --fail --silent --show-error --location --retry 2 "$release_base/SHA256SUMS" --output "$workdir/SHA256SUMS";
        curl --fail --silent --show-error --location --retry 2 "$release_base/$asset" --output "$workdir/$asset";
        awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print; found=1 } END { exit !found }' "$workdir/SHA256SUMS" > "$workdir/ASSET.SHA256";
        cd "$workdir";
        sha256sum --check ASSET.SHA256;
        tar --extract --gzip --file "$asset";
        test -f "$archive_binary";
        sudo install -o root -g root -m 0755 "$archive_binary" /usr/local/bin/{{ ads_harness_catalog[ads_harness_id].command | quote }}
  when: (ads_harness_catalog[ads_harness_id].version | regex_replace('^v', '')) not in ads_github_harness_current.stdout
  changed_when: true

- name: "Verify installed {{ ads_harness_id }} release"
  ansible.builtin.command:
    argv: [distrobox, enter, "{{ ads_box_name }}", --, "/usr/local/bin/{{ ads_harness_catalog[ads_harness_id].command }}", --version]
  register: ads_harness_install
  changed_when: false
  failed_when: >-
    (ads_harness_install.rc != 0 or
     (ads_harness_catalog[ads_harness_id].version | regex_replace('^v', '')) not in ads_harness_install.stdout)
    and not ads_harness_catalog[ads_harness_id].optional
