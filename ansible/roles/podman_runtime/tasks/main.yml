---
- name: Create the private runtime state directory
  ansible.builtin.file:
    path: "{{ ads_runtime_state_path }}"
    state: directory
    mode: "0700"

- name: Calculate the immutable runtime fingerprint
  ansible.builtin.set_fact:
    ads_hardening_fingerprint: >-
      {{ ads_hardening_profile }}-p{{ ads_container_pids_limit }}-m{{ ads_container_memory }}-c{{ ads_container_cpus }}-n{{ ads_container_network_backend }}-hl{{ ads_container_allow_host_loopback | ternary('1', '0') }}

- name: Check for the previously built runtime image
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", image, exists, "{{ ads_runtime_image }}"]
  register: ads_runtime_image_exists
  changed_when: false
  failed_when: false

- name: Inspect an existing provisioning container
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", container, exists, "{{ ads_builder_name }}"]
  register: ads_builder_exists
  changed_when: false
  failed_when: false

- name: Remove a stale provisioning container
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", rm, --force, "{{ ads_builder_name }}"]
  when: ads_builder_exists.rc == 0
  changed_when: true

- name: Start an unprivileged provisioning container
  ansible.builtin.command:
    argv: >-
      {{ [ads_container_manager, 'run', '--detach', '--name', ads_builder_name,
          '--label', 'ads.managed=agentic-builder',
          '--label', 'ads.hardening=' + ads_hardening_fingerprint,
          '--pids-limit', ads_container_pids_limit | string,
          '--memory', ads_container_memory,
          '--cpus', ads_container_cpus,
          '--workdir', ads_runtime_home,
          '--env', 'HOME=' + ads_runtime_home,
          '--env', 'PATH=' + ads_runtime_home + '/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin',
          '--volume', ads_runtime_state_path + ':' + ads_runtime_home + ':rw']
         + (['--network=pasta'] if ads_container_allow_host_loopback else ['--network=pasta:--map-guest-addr,none,--map-host-loopback,none', '--no-hosts'])
         + ([ '--volume', ads_workspace_host_path + ':' + ads_workspace_container_path + (':ro' if ads_workspace_mount_read_only else ':rw') ] if ads_workspace_mount_enabled else [])
         + [ads_runtime_image if ads_runtime_image_exists.rc == 0 else ads_base_image, 'sleep', 'infinity'] }}
  changed_when: true

- name: Confirm the provisioning container can be entered
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_builder_name }}", "true"]
  changed_when: false
