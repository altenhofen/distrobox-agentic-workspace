---
- name: Verify rootless Podman is available on the host
  ansible.builtin.command: "{{ ads_container_manager }} --version"
  changed_when: false

- name: Inspect container isolation settings
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", inspect, "{{ ads_runtime_name }}"]
  register: ads_verify_container_inspect
  changed_when: false

- name: Inspect the effective capability set of the runtime
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_runtime_name }}", awk, "/^CapEff/ {print $2}", /proc/self/status]
  register: ads_verify_effective_caps
  changed_when: false

- name: Validate container isolation settings
  ansible.builtin.assert:
    that:
      - ads_verify_inspect.Config.Labels['ads.hardening'] | default('') == ads_verify_hardening_fingerprint
      - ads_verify_inspect.HostConfig.NetworkMode | default('') != 'host'
      - ads_verify_inspect.HostConfig.PidMode | default('') != 'host'
      - ads_verify_inspect.HostConfig.IpcMode | default('') != 'host'
      - ads_verify_inspect.HostConfig.PidsLimit | default(0) | int > 0
      - ads_verify_inspect.HostConfig.PidsLimit | int <= ads_container_pids_limit | int
      - ads_verify_inspect.HostConfig.ReadonlyRootfs | bool
      - ads_verify_inspect.HostConfig.CapAdd | default([]) | length == 0
      - (ads_verify_effective_caps.stdout | trim) is match('^0+$')
      - "'no-new-privileges' in (ads_verify_inspect.HostConfig.SecurityOpt | default([]) | join(' '))"
    fail_msg: The managed container does not satisfy the configured Buzz hardening profile.
  vars:
    ads_verify_inspect: "{{ (ads_verify_container_inspect.stdout | from_json)[0] }}"
    ads_verify_hardening_fingerprint: >-
      {{ ads_hardening_profile }}-p{{ ads_container_pids_limit }}-m{{ ads_container_memory }}-c{{ ads_container_cpus }}-n{{ ads_container_network_backend }}-hl{{ ads_container_allow_host_loopback | ternary('1', '0') }}

- name: Inspect private Buzz environment permissions
  ansible.builtin.stat:
    path: "{{ ads_runtime_state_path }}/.ads-buzz-env"
  register: ads_verify_buzz_env

- name: Validate private Buzz environment permissions
  ansible.builtin.assert:
    that:
      - not ads_verify_buzz_env.stat.exists or ads_verify_buzz_env.stat.mode == '0600'
    fail_msg: The Buzz environment fragment must be mode 0600.

- name: Verify Buzz uses the credential-loading wrapper
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_runtime_name }}", bash, -c, "grep -q 'exec /usr/local/libexec/ads/buzz' /usr/local/bin/buzz && test -x /usr/local/libexec/ads/buzz && test -x /usr/local/bin/buzz-acp && test ! -e /usr/bin/buzz"]
  changed_when: false

- name: Verify runtime entry and shared tools
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_runtime_name }}", bash, -lc, "command -v {{ item }}"]
  loop: [git, node, npm, python, cargo, rg, yay, buzz]
  changed_when: false

- name: Verify ai-jail is installed when enabled
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_runtime_name }}", ai-jail, --version]
  changed_when: false
  when: ads_ai_jail_enabled

- name: Verify the unrestricted Buzz agent launcher
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_runtime_name }}", test, -x, "{{ ads_runtime_home }}/.local/bin/buzz-agent-create"]
  changed_when: false

- name: Verify every enabled harness locally
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_runtime_name }}", bash, -lc, "{{ ads_harness_catalog[item].verify_command }}"]
  loop: "{{ ads_enabled_harnesses }}"
  register: ads_harness_verification
  changed_when: false
  failed_when: ads_harness_verification.rc != 0 and not ads_harness_catalog[item].optional

- name: Verify harness commands have managed ai-jail wrappers
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", exec, "{{ ads_runtime_name }}", test, -x, "{{ ads_runtime_home }}/.local/bin/{{ ads_harness_catalog[item].command }}"]
  loop: "{{ ads_enabled_harnesses }}"
  changed_when: false
  when: ads_ai_jail_enabled

- name: Explain skipped relay verification
  ansible.builtin.debug:
    msg: Local installation checks passed. Relay/authentication was not tested (ads_buzz_connectivity_check=false).
  when: not ads_buzz_connectivity_check
