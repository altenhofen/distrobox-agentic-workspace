---
- name: Verify Distrobox is available on the host
  ansible.builtin.command: distrobox --version
  changed_when: false

- name: Inspect container isolation settings
  ansible.builtin.command:
    argv: ["{{ ads_container_manager }}", inspect, "{{ ads_box_name }}"]
  register: ads_verify_container_inspect
  changed_when: false

- name: Validate container isolation settings
  ansible.builtin.assert:
    that:
      - ads_verify_inspect.Config.Labels['ads.hardening'] | default('') == ads_verify_hardening_fingerprint
      - ads_verify_inspect.HostConfig.NetworkMode | default('') != 'host'
      - ads_verify_inspect.HostConfig.PidMode | default('') != 'host'
      - ads_verify_inspect.HostConfig.IpcMode | default('') != 'host'
      - ads_verify_inspect.HostConfig.PidsLimit | default(0) | int > 0
      - ads_verify_inspect.HostConfig.PidsLimit | int <= ads_container_pids_limit | int
    fail_msg: The managed container does not satisfy the configured Buzz hardening profile.
  vars:
    ads_verify_inspect: "{{ (ads_verify_container_inspect.stdout | from_json)[0] }}"
    ads_verify_hardening_fingerprint: >-
      {{ ads_hardening_profile }}-p{{ ads_container_pids_limit }}-m{{ ads_container_memory }}-c{{ ads_container_cpus }}-n{{ ads_container_network_backend }}-hl{{ ads_container_allow_host_loopback | ternary('1', '0') }}

- name: Inspect private Buzz environment permissions
  ansible.builtin.stat:
    path: "{{ ads_box_home }}/.ads-buzz-env"
  register: ads_verify_buzz_env

- name: Validate private Buzz environment permissions
  ansible.builtin.assert:
    that:
      - not ads_verify_buzz_env.stat.exists or ads_verify_buzz_env.stat.mode == '0600'
    fail_msg: The Buzz environment fragment must be mode 0600.

- name: Verify box entry and shared tools
  ansible.builtin.command:
    argv: [distrobox, enter, "{{ ads_box_name }}", --, bash, -lc, "command -v {{ item }}"]
  loop: [git, node, npm, python, cargo, rg, yay, buzz]
  changed_when: false

- name: Verify ai-jail is installed when enabled
  ansible.builtin.command:
    argv: [distrobox, enter, "{{ ads_box_name }}", --, ai-jail, --version]
  changed_when: false
  when: ads_ai_jail_enabled

- name: Verify the Buzz agent launcher allowlist
  ansible.builtin.command:
    argv: [distrobox, enter, "{{ ads_box_name }}", --, "{{ ads_box_home }}/.local/bin/buzz-agent-create", --list]
  register: ads_buzz_agent_allowlist_check
  changed_when: false

- name: Confirm every configured Buzz agent is exposed
  ansible.builtin.assert:
    that: item in ads_buzz_agent_allowlist_check.stdout_lines
  loop: "{{ ads_buzz_agent_allowlist.keys() | list }}"

- name: Verify every enabled harness locally
  ansible.builtin.command:
    argv: [distrobox, enter, "{{ ads_box_name }}", --, bash, -lc, "{{ ads_harness_catalog[item].verify_command }}"]
  loop: "{{ ads_enabled_harnesses }}"
  register: ads_harness_verification
  changed_when: false
  failed_when: ads_harness_verification.rc != 0 and not ads_harness_catalog[item].optional

- name: Verify harness commands have managed ai-jail wrappers
  ansible.builtin.command:
    argv: [distrobox, enter, "{{ ads_box_name }}", --, test, -x, "{{ ads_box_home }}/.local/bin/{{ ads_harness_catalog[item].command }}"]
  loop: "{{ ads_enabled_harnesses }}"
  changed_when: false
  when: ads_ai_jail_enabled

- name: Explain skipped relay verification
  ansible.builtin.debug:
    msg: Local installation checks passed. Relay/authentication was not tested (ads_buzz_connectivity_check=false).
  when: not ads_buzz_connectivity_check
